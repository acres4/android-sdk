apply plugin: 'com.diffplug.spotless'

spotless {
    java {
        target '**/*.java'
        googleJavaFormat().aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        indentWithSpaces()
        endWithNewline()
    }
    kotlin {
        ktfmt()
        target '**/*.kt'
        ktlint("0.44.0").userData(['indent_size': '4', 'continuation_indent_size' : '4','disabled_rules':'no-wildcard-imports'])
        trimTrailingWhitespace()
        indentWithSpaces()
        endWithNewline()



        licenseHeaderFile rootProject.file('spotless/header.kt')

    }
    kotlinGradle {
        target '*.gradle.kts'
        ktlint()
    }

    format 'misc', {
        target '**/*.gradle', '**/*.md', '**/.gitignore'
        indentWithSpaces()
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'xml', {
        target '**/*.xml'
        targetExclude '**/strings.xml'
        indentWithSpaces()
        trimTrailingWhitespace()
        endWithNewline()
    }


}


//this will work on mac computers, you have to change terminal commands for windows because chmod is not supported on windows
//this creates pre commit hook that runs spotless tasks on commit, you won't be able to commit any code if spotless fails
task createSpotlessPreCommitHook() {
    def gitHooksDirectory = new File("$project.rootDir/.git/hooks/")
    if (!gitHooksDirectory.exists()) gitHooksDirectory.mkdirs()
    new File("$project.rootDir/.git/hooks", "pre-commit").text =
            "#!/bin/sh\n" +
                    "echo \"Running spotless check...\"\n" +
                    "./gradlew spotlessCheck\n"
    "chmod +x .git/hooks/pre-commit".execute()
}